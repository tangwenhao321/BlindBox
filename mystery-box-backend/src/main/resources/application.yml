spring:
  application:
    name: mystery-box
  profiles:
    active: dev,private
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    resources:
      static-locations: classpath:/dist
server:
  port: 9912
  tomcat:
    max-http-form-post-size: 20MB
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: token
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  # Local/dev may keep true for convenience; prod / prod-vn override to false (see application-prod*.yml).
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 自动续签
  auto-renew: true
security:
  enabled: true
  admin-action-otp: CHANGE_ME_IN_PRIVATE_YML
  analytics:
    enabled: true
    retention-days: 30
    retention-enabled: true
    retention-cron: "0 15 3 * * ?"
  compliance:
    spend-limit:
      enabled: true
      daily: 5000
      monthly: 20000
      cooling-off-hours: 24
    minor:
      enabled: true
      verification-required: false
    identity:
      hash-secret: ${IDENTITY_HASH_SECRET:CHANGE_ME_IDENTITY_HASH_SECRET}
  rate-limit:
    enabled: true
    per-minute: 120
    analytics-per-minute: 60
    distributed: false
    trusted-proxy: false
    login-per-minute: 20
    order-create-per-minute: 30
    prepay-per-minute: 20
    draw-queue-per-minute: 40
    spectator-get-per-minute: 60
    sse-stream-per-minute: 30
  sse:
    # Prod profiles should set true — anonymous feed/pool SSE then requires login.
    require-auth: false
  ios:
    digital-goods:
      # Production App Store builds should set true (missing X-Client-Platform → treat as iOS).
      fail-closed: false
      require-attestation: false
      app-store-channel: appstore
  client-attestation-secret: ${CLIENT_ATTESTATION_SECRET:}
  admin-action-totp-secret: ${ADMIN_ACTION_TOTP_SECRET:}
  idempotency:
    enabled: true
    # 15 minutes — covers client retries after a successful mutating response
    ttl-ms: 900000
    distributed: true
    required: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.MySqlDialect
  show-sql: true
  pretty-sql: true
  client:
    ts:
      path: /ts.zip
    openapi:
      path: /openapi
      ui-path: /openapi-ui
  trigger-type: transaction_only
wx:
  # 微信开放平台配置（保留 miniapp 键以兼容现有 SDK）
  miniapp:
    appid: xxxx
    secret: xxxx
    config-storage:
      http-client-type: HttpClient
      type: redistemplate
  # 微信支付配置
  pay:
    app-id: xxxx
    mch-id: xxxx
    apiv3-key: xxxx
    cert-serial-no: xxxx
    privateKeyPath: classpath:wechat/apiclient_key.pem
    privateCertPath: classpath:wechat/apiclient_cert.pem
sms:
  # none | ali_yun | vn_esms
  provider: none
  # 阿里云短信配置
  ali-yun:
    access-key-id: xxx
    access-key-secret: xxx
    sign-name: xxx
    template-code: xxx
  # Vietnam eSMS-shaped stub (enable with sms.provider=vn_esms)
  vn-esms:
    api-key: ${SMS_VN_ESMS_API_KEY:}
    secret-key: ${SMS_VN_ESMS_SECRET_KEY:}
    brandname: ${SMS_VN_ESMS_BRANDNAME:}
# MoMo defaults — stub until Partner API; prod-vn hard-disables offering
momo:
  enabled: false
  stub: true
  partner-wired: ${MOMO_PARTNER_WIRED:false}
zalopay:
  enabled: false
  stub: true
  partner-wired: ${ZALOPAY_PARTNER_WIRED:false}
# Zalo OAuth login (POST /front/auth/zalo/login). Prefer client-id/secret; app-id/app-secret aliases work too.
# Token: POST https://oauth.zaloapp.com/v4/access_token | Profile: GET https://graph.zalo.me/v2.0/me
zalo:
  client-id: ${ZALO_CLIENT_ID:}
  client-secret: ${ZALO_CLIENT_SECRET:}
  # app-id: ${ZALO_APP_ID:}
  # app-secret: ${ZALO_APP_SECRET:}
oss:
  provider: ali_yun
  # 阿里云oss配置
  ali-yun:
    access-key-id: xxx
    access-key-secret: xxx
    endpoint: xxx
    bucket-name: xxx
tenant:
  map:
    key: xxx
app:
  auth:
    zalo-enabled: false
  # local | ghn | ghtk | viettel
  logistics:
    provider: ${APP_LOGISTICS_PROVIDER:local}
    # Stay false until Partner HTTP client is implemented (token alone is insufficient).
    partner-wired: ${APP_LOGISTICS_PARTNER_WIRED:false}
    ghn:
      token: ${LOGISTICS_GHN_TOKEN:}
    ghtk:
      token: ${LOGISTICS_GHTK_TOKEN:}
    viettel:
      token: ${LOGISTICS_VIETTEL_TOKEN:}
  team-lottery:
    boost-enabled: ${APP_TEAM_LOTTERY_BOOST_ENABLED:false}
  pity:
    # price floor : pity threshold (draws). Used only when box.pityThreshold is unset/0.
    # Do not use floor 0 if you want admin UI thresholds to apply for cheap boxes.
    price-thresholds: "50:60,100:50,200:40"
    compensate-points: 100
    # When > 0: points = max(compensate-points, round(boxPrice * rate))
    compensate-points-rate: ${APP_PITY_COMPENSATE_POINTS_RATE:0}
  draw:
    # Max stacked positive hidden boost as % of base hidden (house-edge guard).
    dynamic-boost-cap-percent: ${APP_DRAW_DYNAMIC_BOOST_CAP_PERCENT:25}
    # Min margin vs retail-price EV proxy at admin save (0.15 = 15%).
    min-margin-ratio: ${APP_DRAW_MIN_MARGIN_RATIO:0.15}
    # Free terminal prize when pool empties (lastOne). Off by default — kills margin.
    last-one-enabled: ${APP_DRAW_LAST_ONE_ENABLED:false}
  newcomer:
    first-draw-price: ${APP_NEWCOMER_FIRST_DRAW_PRICE:0.01}
    # Max prize EV allowed under first-draw subsidy; above this, charge full pack price.
    max-ev-cost: ${APP_NEWCOMER_MAX_EV_COST:50}
    enabled: ${APP_NEWCOMER_SUBSIDY_ENABLED:true}
  marketplace:
    fee-rate: ${MARKETPLACE_FEE_RATE:0.05}
    payout-gateway: ${MARKETPLACE_PAYOUT_GATEWAY:wallet}
    external-payout-timeout-hours: ${MARKETPLACE_EXTERNAL_PAYOUT_TIMEOUT_HOURS:24}
  # local | ekyc_vendor — local = checksum/format validation; ekyc_vendor requires vendor wiring
  identity:
    provider: ${APP_IDENTITY_PROVIDER:local}
  fairness:
    # When false, applyWinRuleIfPresent skips overwrite (prod-vn sets false).
    allow-win-rule-override: ${APP_FAIRNESS_ALLOW_WIN_RULE_OVERRIDE:false}
  referral:
    commission-rate: ${APP_REFERRAL_COMMISSION_RATE:0.05}
  compliance:
    teen-daily-cap: 140
  mobile-update:
    android-version-code: ${APP_ANDROID_VERSION_CODE:0}
    android-version-name: ${APP_ANDROID_VERSION_NAME:}
    android-download-url: ${APP_ANDROID_DOWNLOAD_URL:}
    android-force-update: ${APP_ANDROID_FORCE_UPDATE:false}
    android-release-notes: ${APP_ANDROID_RELEASE_NOTES:}
    # Clients below this build are forced to update; 0 disables the floor.
    android-min-supported-version-code: ${APP_ANDROID_MIN_SUPPORTED_VERSION_CODE:0}
    # Fan-out of APP_UPDATE pushes when a release is published from the admin panel.
    push-enabled: ${APP_UPDATE_PUSH_ENABLED:true}
  cors:
    allowed-origin-patterns: "*"
  support:
    hotline: ${APP_SUPPORT_HOTLINE:400-000-0000}
    enterprise-wechat: ${APP_SUPPORT_WECHAT:}
  privacy:
    mask-nickname-suffix: 4
  # Retention: original unpaid order only; 1 claim / user / day.
  # Flat discount-amount (currency default VND 10000 / CNY 5), or discount-percent (0–100)
  # capped by discount-amount / max-discount-amount.
  retention:
    max-claims-per-user-per-day: 1
    # discount-percent: 5
    # max-discount-amount: 10000
  cache:
    home-summary-ttl-seconds: 60
  pool:
    reconcile:
      auto-fix: false
  queue:
    head-timeout-sec: ${QUEUE_HEAD_TIMEOUT_SEC:120}
    ttl-hours: ${QUEUE_TTL_HOURS:2}
    lock-ttl-sec: 120
  sse:
    scheduler:
      pool-size: 8
  jobs:
    payment-reconcile:
      cron: "0 */5 * * * ?"
      min-age-minutes: 10
      batch-size: 50
    refund-reconcile:
      enabled: true
      cron: "0 */7 * * * ?"
      min-age-minutes: 10
      batch-size: 50
    draw-integrity:
      enabled: true
      cron: "0 30 4 * * ?"
      lookback-hours: 24
      batch-size: 200
      empty-repair-min-age-minutes: 15
    wallet-reconcile:
      enabled: true
      cron: "0 15 3 * * ?"
      lookback-hours: 48
      sample-size: 100
    pool-slot-expire-ms: 60000