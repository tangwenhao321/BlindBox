spring:
  config:
    activate:
      on-profile: prod

jimmer:
  show-sql: false
  pretty-sql: false
  client:
    ts:
      path:
    openapi:
      path:
      ui-path:

# Public actuator only. Documented option: set management.server.port and expose prometheus there.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Each login gets its own token (harder to hijack shared session across devices/instances).
# Cookie HttpOnly/Secure/SameSite: Sa-Token 1.37 SaCookieConfig (sa-token.cookie.*).
sa-token:
  is-share: false
  is-read-header: true
  is-read-cookie: true
  cookie:
    httpOnly: true
    secure: true
    sameSite: Strict

app:
  auth:
    allow-mock-otp: false
    zalo-enabled: ${APP_AUTH_ZALO_ENABLED:false}
  cors:
    allowed-origin-patterns: ${APP_CORS_ORIGINS:https://admin.example.com,https://h5.example.com}
  queue:
    head-timeout-sec: ${QUEUE_HEAD_TIMEOUT_SEC:120}
    ttl-hours: ${QUEUE_TTL_HOURS:2}
    lock-ttl-sec: ${QUEUE_LOCK_TTL_SEC:120}
  pool:
    reconcile:
      auto-fix: ${APP_POOL_RECONCILE_AUTO_FIX:false}
  sse:
    scheduler:
      pool-size: ${APP_SSE_SCHEDULER_POOL_SIZE:8}
  jobs:
    draw-integrity:
      enabled: ${APP_DRAW_INTEGRITY_JOB_ENABLED:true}
      cron: "${APP_DRAW_INTEGRITY_CRON:0 30 4 * * ?}"
      lookback-hours: ${APP_DRAW_INTEGRITY_LOOKBACK_HOURS:24}
      batch-size: ${APP_DRAW_INTEGRITY_BATCH_SIZE:200}
      empty-repair-min-age-minutes: ${APP_DRAW_INTEGRITY_EMPTY_REPAIR_MIN_AGE:15}
    refund-reconcile:
      enabled: ${APP_REFUND_RECONCILE_JOB_ENABLED:true}
      cron: "${APP_REFUND_RECONCILE_CRON:0 */7 * * * ?}"
      min-age-minutes: ${APP_REFUND_RECONCILE_MIN_AGE_MINUTES:10}
      batch-size: ${APP_REFUND_RECONCILE_BATCH_SIZE:50}
    wallet-reconcile:
      enabled: ${APP_WALLET_RECONCILE_JOB_ENABLED:true}
      cron: "${APP_WALLET_RECONCILE_CRON:0 15 3 * * ?}"
      lookback-hours: ${APP_WALLET_RECONCILE_LOOKBACK_HOURS:48}
      sample-size: ${APP_WALLET_RECONCILE_SAMPLE_SIZE:100}
  reveal:
    particle-scale: ${APP_REVEAL_PARTICLE_SCALE:1.0}
    confetti-scale: ${APP_REVEAL_CONFETTI_SCALE:1.0}
    delay-ms-override: ${APP_REVEAL_DELAY_MS_OVERRIDE:0}
  support:
    hotline: ${APP_SUPPORT_HOTLINE:400-000-0000}
    enterprise-wechat-id: ${APP_ENTERPRISE_WECHAT_ID:}

payment:
  mock-enabled: false

sms:
  provider: ${SMS_PROVIDER:ali_yun}

security:
  default-admin:
    enabled: false
  ios:
    digital-goods:
      fail-closed: true
      require-attestation: ${IOS_REQUIRE_CLIENT_ATTESTATION:false}
      app-store-channel: appstore
  client-attestation-secret: ${CLIENT_ATTESTATION_SECRET:}
  sse:
    require-auth: true
  compliance:
    minor:
      verification-required: ${COMPLIANCE_VERIFICATION_REQUIRED:false}
    identity:
      hash-secret: ${IDENTITY_HASH_SECRET:}
  rate-limit:
    # Distributed rate limit when Redis is available (default true for prod)
    distributed: ${RATE_LIMIT_DISTRIBUTED:true}
    trusted-proxy: ${RATE_LIMIT_TRUSTED_PROXY:true}
    sse-stream-per-minute: ${RATE_LIMIT_SSE_STREAM_PER_MINUTE:30}
  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
    retention-days: ${ANALYTICS_RETENTION_DAYS:90}
    retention-enabled: true

push:
  expo:
    enabled: ${PUSH_EXPO_ENABLED:true}
