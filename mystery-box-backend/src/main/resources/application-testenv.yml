# 测试环境 Spring Profile（与 dev / 四方系统 隔离）
# 激活: SPRING_PROFILES_ACTIVE=testenv,private-test
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    repair-on-migrate: true
    validate-on-migrate: false
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:3307}/mystery_box_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      url: "${REDIS_URL:redis://:${TEST_REDIS_PASSWORD:}@${TEST_REDIS_HOST:127.0.0.1}:${TEST_REDIS_PORT:6381}/1}"
      timeout: 10s
      lettuce:
        pool:
          max-active: 100
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
      repositories:
        enabled: false

server:
  port: ${TEST_SERVER_PORT:9913}

payment:
  mock-enabled: true

app:
  auth:
    allow-mock-otp: true
    seed-dev-mobile-user: true
    dev-mobile-phone: "${TEST_MOBILE_PHONE:13900000001}"
    dev-mobile-password: "${TEST_MOBILE_PASSWORD:}"
  community:
    auto-approve: true
  reveal:
    e2e-fixture:
      enabled: false
  support:
    hotline: "${APP_SUPPORT_HOTLINE:400-TEST-0001}"
  mobile-update:
    android-version-code: ${APP_ANDROID_VERSION_CODE:6}
    android-version-name: ${APP_ANDROID_VERSION_NAME:1.0.5}
    android-download-url: ${APP_ANDROID_DOWNLOAD_URL:}
    android-force-update: ${APP_ANDROID_FORCE_UPDATE:false}
    android-release-notes: ${APP_ANDROID_RELEASE_NOTES:test build}

security:
  admin-action-otp: "${ADMIN_ACTION_OTP:}"
  default-admin:
    enabled: true
    account: admin_test
    password: "${DEFAULT_ADMIN_PASSWORD:}"
  feature-flags:
    mobile-home-enhanced: true
    mobile-detail-rarity-ui: true
    mobile-analytics-upload: false
    admin-ops-analytics-dashboard: true
    backend-community-persistence: true
  analytics:
    enabled: false
  rate-limit:
    distributed: true
  risk-control:
    enabled: true
    confirm-threshold: 80
    device-user-limit: 5

management:
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    io.github.qifan777: INFO
    org.springframework.web: INFO
