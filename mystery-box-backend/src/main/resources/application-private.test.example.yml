# 复制为 application-private-test.yml（gitignore 建议加入）
# 与四方系统 / 本地 dev 的 application-private.yml 完全分离
# 所有口令必须用强随机值，切勿提交真实密码到仓库

spring:
  datasource:
    username: root
    password: "CHANGE_ME_STRONG_DB_PASSWORD"

wx:
  miniapp:
    appid: test-appid
    secret: CHANGE_ME_WX_SECRET
  pay:
    app-id: test-app-id
    mch-id: test-mch-id
    apiv3-key: CHANGE_ME_WX_APIV3_KEY
    cert-serial-no: test-cert-serial
    notify-url: http://127.0.0.1:9913/front/mystery-box-order/notify/pay/wechat

oss:
  provider: local
  local:
    base-dir: ${UPLOAD_DIR:/opt/mystery-box-test/data/uploads-test}
    public-base-url: /uploads

sms:
  provider: none

tenant:
  map:
    key: CHANGE_ME_TENANT_MAP_KEY

security:
  admin-action-otp: "CHANGE_ME_ADMIN_OTP"
  default-admin:
    enabled: true
    account: admin_test
    password: "CHANGE_ME_ADMIN_PASSWORD"
