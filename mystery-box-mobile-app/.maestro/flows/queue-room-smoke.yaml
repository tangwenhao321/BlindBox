appId: mystery-box-mobile-app
---
- launchApp
- runFlow:
    when:
      visible:
        id: "loginPhoneInput"
    file: login-smoke.yaml
- tapOn:
    id: "boxCard-.*"
    optional: true
- tapOn:
    id: "drawMode-queue"
    optional: true
- assertVisible:
    id: "drawQueuePanel"
    optional: true
