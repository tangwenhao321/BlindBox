name: mobile-export-budget

# Full `expo export` size gate (slow — not on default PR push paths).
# Nightly + manual: always runs check:bundle-export-budget:strict after export.
# See mystery-box-mobile-app/scripts/check-bundle-export-budget.mjs

on:
  workflow_dispatch:
  schedule:
    # Nightly 16:00 UTC (~00:00 CST next day)
    - cron: "0 16 * * *"

jobs:
  export-budget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mystery-box-mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mystery-box-mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo export (android)
        run: npx expo export --output-dir dist-export --platform android

      - name: Check export size budget (strict — default for this workflow)
        env:
          # Override with repo variable if needed, e.g. 52428800 (50 MiB)
          EXPO_EXPORT_BUDGET_BYTES: ${{ vars.EXPO_EXPORT_BUDGET_BYTES || '41943040' }}
          # Strict is the job default (also via npm script --strict). Soft mode is local-only.
          EXPO_EXPORT_BUDGET_STRICT: "1"
        run: npm run check:bundle-export-budget:strict
        # To skip without removing the workflow: set SKIP_EXPO_EXPORT_BUDGET=1
        # env:
        #   SKIP_EXPO_EXPORT_BUDGET: "1"
