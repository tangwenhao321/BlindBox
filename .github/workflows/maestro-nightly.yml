name: maestro-nightly

# Inventory always; full device run only when MAESTRO_RUN_DEVICE=1 (device farm / emulator).
# See mystery-box-mobile-app/.maestro/README.md and scripts/maestro-ci-smoke.sh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  maestro-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Maestro flow inventory (always)
        run: bash scripts/maestro-ci-smoke.sh

      - name: Maestro device suite (optional)
        working-directory: mystery-box-mobile-app
        env:
          MAESTRO_RUN_DEVICE: ${{ vars.MAESTRO_RUN_DEVICE || '0' }}
          MAESTRO_TEST_PHONE: ${{ vars.MAESTRO_TEST_PHONE || '13800138000' }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD || vars.MAESTRO_TEST_PASSWORD || 'Admin@123456' }}
        run: |
          if [ "$MAESTRO_RUN_DEVICE" != "1" ]; then
            echo "Skip device suite. Set repo variable MAESTRO_RUN_DEVICE=1 when emulator/farm is wired."
            exit 0
          fi
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test --config .maestro/config.yaml
